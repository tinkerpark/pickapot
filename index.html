<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pick a pot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #efece4;          /* soft off-white */
    --ink-dim: rgba(239, 236, 228, 0.82);
    --line: rgba(239, 236, 228, 0.7);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    color: var(--ink);
    font-family: "Montserrat", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    font-weight: 300;
    /* Drop your image in as bg.jpg next to this file. The gradient is a fallback. */
    background:
      linear-gradient(rgba(0,0,0,.28), rgba(0,0,0,.28)),
      url("bg.jpg") center / cover no-repeat,
      radial-gradient(ellipse at 30% 20%, #2f4a28, #14210f 70%);
    background-color: #14210f;
    display: grid;
    place-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  main {
    width: calc(100vw - 12vw);
  }
  .brand {
    position: absolute;
    top: 8vh;
    right: 6vw;
    width: 7.5rem;
    margin: 0;
    pointer-events: none;
  }
  .brand h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 400;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    line-height: 1.6;
    color: var(--ink);
  }
  .row {
    display: flex;
    align-items: flex-end;
    gap: 18px;
  }
  .row input { flex: 1; min-width: 0; }
  #go {
    appearance: none;
    border: 0;
    background: transparent;
    width: 7.5rem;
    padding: 0;
    margin-bottom: 8px;
    text-align: left;
    font: inherit;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink);
    cursor: pointer;
    transition: opacity .2s;
  }
  #go:hover { opacity: .65; }
  #go:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }
  input {
    display: block;
    width: 100%;
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    outline: none;
    padding: 10px 0 12px;
    font: inherit;
    font-size: 26px;
    font-weight: 300;
    color: var(--ink);
    caret-color: var(--ink);
    caret-shape: bar;
    transition: border-color .3s;
  }
  input:focus { border-bottom-color: var(--ink); }
  input::placeholder { color: transparent; }
  .engines {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 4px;
    justify-content: center;
    margin: 30px 0 0;
  }
  .engines button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 15px;
    letter-spacing: 0.02em;
    padding: 4px 8px;
    cursor: pointer;
    opacity: .75;
    transition: background .18s, color .18s, opacity .18s;
  }
  .engines button:hover { opacity: 1; }
  .engines button[aria-pressed="true"] {
    background: #fff;
    color: #000;
    opacity: 1;
  }
  .engines button:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
  .hint {
    position: absolute;
    right: 11vw;
    bottom: 20vh;
    max-width: min(340px, 70vw);
    text-align: right;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    line-height: 1.8;
    color: var(--ink-dim);
  }
  .hint a { color: var(--ink); text-underline-offset: 3px; }
  footer {
    position: absolute;
    right: 24px;
    bottom: 20px;
    max-width: 150px;
    text-align: right;
    font-size: 10px;
    letter-spacing: 0.06em;
    line-height: 1.6;
    color: var(--ink-dim);
  }
</style>
</head>
<body>
<header class="brand"><h1>pick<br>a pot</h1></header>
<main>
  <div class="row">
    <input id="q" type="text" autofocus autocomplete="off" spellcheck="false" aria-label="Search" placeholder="search">
    <button id="go" type="button">Enter</button>
  </div>
  <div class="engines" id="engines" role="group" aria-label="Search engines"></div>
</main>
<div class="hint" id="hint"></div>
<footer>Allow popups to search multiple engines at once.</footer>

<script>
const ENGINES = [
  { name: "Google",     url: "https://www.google.com/search?q=" },
  { name: "Ecosia",     url: "https://www.ecosia.org/search?q=" },
  { name: "DuckDuckGo", url: "https://duckduckgo.com/?q=" },
  { name: "Perplexity", url: "https://www.perplexity.ai/search?q=" },
];

const q = document.getElementById("q");
const box = document.getElementById("engines");
const hint = document.getElementById("hint");

let selected;
try { selected = new Set(JSON.parse(localStorage.getItem("pickapot") || "null") || [ENGINES[0].name]); }
catch { selected = new Set([ENGINES[0].name]); }

const save = () => { try { localStorage.setItem("pickapot", JSON.stringify([...selected])); } catch {} };

ENGINES.forEach(e => {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = e.name;
  b.setAttribute("aria-pressed", selected.has(e.name));
  b.addEventListener("click", () => {
    selected.has(e.name) ? selected.delete(e.name) : selected.add(e.name);
    b.setAttribute("aria-pressed", selected.has(e.name));
    save();
    hint.textContent = "";
    q.focus();
  });
  box.appendChild(b);
});

function go() {
  const term = q.value.trim();
  if (!term) return;
  const picks = ENGINES.filter(e => selected.has(e.name));
  if (!picks.length) { hint.textContent = "choose a search engine"; return; }
  const blocked = picks.filter(e => !window.open(e.url + encodeURIComponent(term), "_blank"));
  hint.textContent = "";
  if (blocked.length) {
    hint.append("Blocked: ");
    blocked.forEach((e, i) => {
      const a = document.createElement("a");
      a.href = e.url + encodeURIComponent(term);
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = e.name;
      hint.append(i ? ", " : "", a);
    });
    hint.append(" — allow popups to open all at once");
  } else {
    hint.textContent = "";
  }
}

document.getElementById("go").addEventListener("click", go);
q.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
document.addEventListener("click", e => { if (!e.target.closest("button")) q.focus(); });
</script>
</body>
</html>
